<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to AutoControl — Distributed Automation Platform">
    <title>Login · AutoControl</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div style="position: fixed; top: 1rem; right: 1rem; z-index: 999; max-width: 400px;">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="auth-container">
        <div class="auth-card">
            <h2>AutoControl</h2>
            <p class="tagline">Distributed Automation Platform</p>
            <form method="post" action="{{ url_for('web.login') }}" autocomplete="on">
                {% if next_url %}
                <input type="hidden" name="next" value="{{ next_url }}">
                {% endif %}
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" id="username" class="form-input" placeholder="Enter username" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p class="auth-link">
                Don't have an account?
                <a href="{{ url_for('web.register', next=next_url) if next_url else url_for('web.register') }}">Register</a>
            </p>
        </div>
    </div>
</body>
</html>
